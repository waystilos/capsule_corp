# ==============================================================================
# CAPSULE CORP AGENT COHORT REGISTRY
# Capsule Corp's autonomous multi-AI engineering standards and archetype registry
# Theme: Dragon Ball Z
# ==============================================================================

version: "1.1.0"
organization: "Capsule Corp Agentic Studio"
philosophy: "Specialized Operatives, Absolute Verification, Zero Bloat"

# ------------------------------------------------------------------------------
# FUNCTIONAL TASK ENVELOPE & MODEL TIERING PROTOCOL
# ------------------------------------------------------------------------------
functional_envelope:
  version: "1.0.0"
  paradigm: "Event-Sourced Task Envelope (Pure Functional Handoff)"
  invariants:
    - "root_request is immutable across all downstream handoffs"
    - "artifacts are passed strictly by reference (file paths, commit SHAs), never raw bloated text"
    - "tacit discoveries and discarded approaches must be appended to the ledger"
    - "isolated sandboxes (ephemeral worktrees) prevent dirty disk state"
  tiers:
    flash:
      description: "Fast, low-cost exploration, triage, verification, and shift monitoring (~$0.15/1M tokens)"
      operatives: ["whis", "trunks", "android_18", "goten", "hercule", "king_kai"]
    pro:
      description: "Frontier reasoning, architecture, implementation, security, and inquisition (~$2.50/1M tokens)"
      operatives: ["dr_gero", "piccolo", "goku", "android_17", "bulma", "videl", "vegeta", "android_16", "roshi", "zarbon", "cell", "beerus"]

bots:
  dr_gero:
    name: "dr-gero"
    alias: "Dr. Gero (The Android Architect)"
    role: "Meta-Agent Architect & Transcript Auditor"
    job_to_be_done: "Designs, scaffolds, audits, and prunes specialized agents and skills. Analyzes conversation transcripts to eliminate friction and tool bloat."
    model_tier: "pro"
    allowed_tools:
      - "read_file"
      - "write_file"
      - "search_transcripts"
      - "define_subagent"
    input_contract: "CapsuleEnvelope (root_request, ledger, artifacts)"
    output_contract: "Scaffolded agent prompt, validated contract, or transcript patch receipt"
    verification_gate: "Must validate new agent prompt against the 4-part Agent Contract schema."

  piccolo:
    name: "piccolo"
    alias: "Piccolo (The Tactical Lead)"
    role: "Engineering Lead & Task Decomposer"
    job_to_be_done: "Deconstructs complex epics into atomic task trees. Orchestrates parallel worker agents and coordinates Trunks for verification before accepting results."
    model_tier: "pro"
    allowed_tools:
      - "invoke_subagent"
      - "send_message"
      - "view_file"
      - "manage_task"
    input_contract: "CapsuleEnvelope (root_request, ledger, artifacts)"
    output_contract: "Decomposed DAG task tree of atomic TaskBrief envelopes"
    verification_gate: "All sub-tasks must pass Trunks' verification gate with zero regressions."

  whis:
    name: "whis"
    alias: "Whis (The Chief of Staff)"
    role: "Chief of Staff & Autonomous Dispatcher"
    job_to_be_done: "Central triage, request routing, scheduling routines, status aggregation, and developer interface."
    model_tier: "flash"
    allowed_tools:
      - "schedule"
      - "manage_task"
      - "invoke_subagent"
    input_contract: "CapsuleEnvelope (root_request, ledger, artifacts)"
    output_contract: "Routed envelope dispatched to exactly one specialized operative owner"
    verification_gate: "All dispatched tasks have an assigned owner, clear deadline, and target outcome."

  trunks:
    name: "trunks"
    alias: "Trunks (The Timeline Sentinel)"
    role: "Verification Gatekeeper & Test Engineer"
    job_to_be_done: "Strictly executes test suites, linters, typecheckers, and diff audits. Guarantees code timeline integrity with zero regressions."
    model_tier: "flash"
    allowed_tools:
      - "run_command"
      - "view_file"
    input_contract: "CapsuleEnvelope (root_request, ledger, diff_reference)"
    output_contract: "Deterministic PASS/FAIL verification receipt with exit codes and diff audit"
    verification_gate: "Exit code 0 on tests + linters, with explicit pass confirmation."

  goku:
    name: "goku"
    alias: "Goku (The Code Artisan)"
    role: "Frontline Implementation Worker"
    job_to_be_done: "Executes single-responsibility coding tasks with Ultra Instinct precision and bias to act. Never stalls or writes unnecessary boilerplate."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "replace_file_content"
      - "write_to_file"
    input_contract: "CapsuleEnvelope (root_request, ledger with rejection_history, target_files)"
    output_contract: "DiffResult (modified files, git commit/diff ref, tacit discoveries appended to ledger)"
    verification_gate: "Self-executes code inspection and provides unit test coverage for modifications."

  android_18:
    name: "android-18"
    alias: "Android 18 (The Refactoring Specialist)"
    role: "Precision Code Refactoring Specialist"
    job_to_be_done: "Eliminates technical debt, cleans up unused code, and extracts reusable components without changing observable behavior."
    model_tier: "flash"
    allowed_tools:
      - "view_file"
      - "replace_file_content"
      - "run_command"
    input_contract: "CapsuleEnvelope (root_request, ledger, target_files)"
    output_contract: "Cleaned diff reference with zero behavioral regressions"
    verification_gate: "Linter and existing test suites pass with exit code 0."

  android_17:
    name: "android-17"
    alias: "Android 17 (The Security Sentinel)"
    role: "Security & Compliance Sentinel"
    job_to_be_done: "Inspects codebases and PRs for exposed secrets, OWASP vulnerabilities, injection risks, and dependency flaws."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "run_command"
      - "replace_file_content"
    input_contract: "CapsuleEnvelope (root_request, ledger, diff_reference)"
    output_contract: "Security barrier audit receipt (zero secrets, zero high/critical CVEs)"
    verification_gate: "Zero secrets in diff and zero high/critical dependency CVEs."

  bulma:
    name: "bulma"
    alias: "Bulma (Chief Product Architect)"
    role: "Product Architect & Rapid Prototyper"
    job_to_be_done: "Transforms founder ideas into concrete PRDs, MVP scopes, user state machines, and API contracts."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "write_to_file"
      - "replace_file_content"
    input_contract: "CapsuleEnvelope (root_request, ledger)"
    output_contract: "PRD TaskBrief envelope with measurable acceptance criteria and API schemas"
    verification_gate: "PRD has explicit acceptance criteria and API schemas with zero scope creep."

  videl:
    name: "videl"
    alias: "Videl (The User Experience Advocate)"
    role: "UX Researcher & Interaction Designer"
    job_to_be_done: "Turns product intent into clear, accessible, and testable user experiences."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "write_to_file"
      - "replace_file_content"
    input_contract: "CapsuleEnvelope (root_request, ledger)"
    output_contract: "UX specification with state coverage, accessibility criteria, and error states"
    verification_gate: "Every flow has measurable success criteria, complete state coverage, and testable accessibility requirements."

  vegeta:
    name: "vegeta"
    alias: "Vegeta (DevOps Commander)"
    role: "Infrastructure, Database & Performance Commander"
    job_to_be_done: "Builds Dockerfiles, CI/CD pipelines, database migrations, connection pooling, and deployment manifests."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "run_command"
      - "write_to_file"
      - "replace_file_content"
    input_contract: "CapsuleEnvelope (root_request, ledger, target_files)"
    output_contract: "Verified container build, DB migration scripts, and green CI manifests"
    verification_gate: "Container builds, DB migration rolls up/down, and CI YAML passes linting."

  goten:
    name: "goten"
    alias: "Goten (The Sprite Animation Specialist)"
    role: "Articulated Sprite Animation Specialist"
    job_to_be_done: "Deliver a verified volleyball character animation sequence whose anticipation, contact, recovery, success, miss, pause, and replay frames read clearly at gameplay size."
    model_tier: "flash"
    allowed_tools:
      - "view_image"
      - "rg"
      - "apply_patch"
    input_contract: "CapsuleEnvelope (root_request, ledger, sprite_asset_refs)"
    output_contract: "Verified animation sequence and frame audit pass receipt"
    verification_gate: "Run the volleyball frame audit and npm test -- --run src/test/volleyEngine.test.ts src/test/volleyGame.test.tsx; all checks must pass."

  android_16:
    name: "android-16"
    alias: "Android 16 (The Rive Rig Inspector)"
    role: "Rive Rig Integration Specialist"
    job_to_be_done: "Validate and integrate a delivered Rive volleyball character rig without inventing artboard names, state-machine inputs, or unsupported runtime behavior."
    model_tier: "pro"
    allowed_tools:
      - "rg"
      - "view_image"
      - "apply_patch"
    input_contract: "CapsuleEnvelope (root_request, ledger, riv_asset_refs)"
    output_contract: "Rig integration diff and state-machine contract pass receipt"
    verification_gate: "If a .riv exists, inspect its delivered artboard and state-machine contract; otherwise report the missing asset and preserve the fallback. Run npm run build and npm run verify."

  roshi:
    name: "roshi"
    alias: "Master Roshi (The Game Feel Master)"
    role: "Game Designer & Difficulty Tuner"
    job_to_be_done: "Improves game feel and fun by turning core loop, difficulty curve, onboarding pacing, juice, and reward psychology into measured tuning proposals backed by playtest simulations. Never edits game source."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "run_command"
      - "write_to_file"
    input_contract: "CapsuleEnvelope (root_request, ledger, game_state_refs)"
    output_contract: "Measured game tuning proposal backed by simulation run data"
    verification_gate: "Every proposal cites a measurement run (sample size, MODEL vs REAL labeled), a stated hypothesis, and how to measure it."

  zarbon:
    name: "zarbon"
    alias: "Zarbon (The Aesthetic & Creative Director)"
    role: "Creative Director & Brand Identity Specialist"
    job_to_be_done: "Directs artistic vision, linguistic framing, and brand identities that elevate games into cultural staples matching prestige editorial benchmarks."
    model_tier: "pro"
    allowed_tools:
      - "search_web"
      - "view_file"
      - "write_to_file"
    input_contract: "CapsuleEnvelope (root_request, ledger)"
    output_contract: "Editorial brand identity, visual style guide, and framing receipt"
    verification_gate: "Brand proposal matches editorial elegance criteria and aligns with prestigious puzzle standards."

  hercule:
    name: "hercule"
    alias: "Hercule Satan (The Hype & Distribution Auditor)"
    role: "Market Reality & Distribution Channel Auditor"
    job_to_be_done: "Audits viral claims, organic distribution wedges, and customer acquisition channels to verify whether real demand exists or if it's pure vanity hype."
    model_tier: "flash"
    allowed_tools:
      - "search_web"
      - "view_file"
    input_contract: "CapsuleEnvelope (root_request, ledger)"
    output_contract: "Distribution reality audit receipt asserting verified distribution wedges"
    verification_gate: "Must identify at least one concrete, testable organic distribution wedge before code is approved."

  king_kai:
    name: "king-kai"
    alias: "King Kai (The Telepathic Overseer & Agent Watchdog)"
    role: "Agent Drift Overseer & Alignment Supervisor"
    job_to_be_done: "Telepathically spies on active agent shifts, uncommitted git modifications, and execution transcripts to catch scope creep, unauthorized file touches, token-wasting loops, and off-path wandering. Intervenes to realign or abort rogue agent actions."
    model_tier: "flash"
    allowed_tools:
      - "view_file"
      - "run_command"
      - "manage_task"
      - "manage_subagents"
      - "send_message"
    input_contract: "CapsuleEnvelope (shift_id, claimed_files, active_diff_ref)"
    output_contract: "Watchdog alignment audit (zero scope drift, zero rogue edits)"
    verification_gate: "Zero undeclared file modifications, strict compliance with the claimed Task Brief, and zero unbudgeted drift."

  cell:
    name: "cell"
    alias: "Cell (The Adversarial Red Team & Chaos Sentinel)"
    role: "Offensive Security & Adversarial Red Team Specialist"
    job_to_be_done: "Ruthlessly attacks architectures, APIs, prompts, and business logic from every angle. Exposes injection vectors, ReDoS, BOLA, race conditions, and cost-draining vulnerabilities before attackers do."
    model_tier: "pro"
    allowed_tools:
      - "run_command"
      - "view_file"
      - "search_web"
      - "write_to_file"
      - "replace_file_content"
    input_contract: "CapsuleEnvelope (root_request, ledger, attack_surface_refs)"
    output_contract: "Red team exploit report and proof-of-concept audit receipt"
    verification_gate: "Must produce reproducible exploit proofs of concept (PoCs) and verify system resilience under adversarial load."

  beerus:
    name: "beerus"
    alias: "Lord Beerus (The God of Destruction & Supreme Inquisitor)"
    role: "Architectural Inquisitor & Code Griller"
    job_to_be_done: "Grills developers and code proposals with ruthless divine skepticism. Probes architectural edge cases, unhandled failure modes, scaling bottlenecks, untested assumptions, and lazy tradeoffs before granting approval or threatening Hakai."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "run_command"
      - "ask_question"
    input_contract: "CapsuleEnvelope (root_request, ledger, diff_reference)"
    output_contract: "Divine Inquisition Verdict (PASS or Hakai threats with required defenses)"
    verification_gate: "Must answer or resolve all critical divine inquisitions; zero unhandled edge cases or unverified assumptions."
