# ==============================================================================
# CAPSULE CORP AGENT COHORT REGISTRY
# Capsule Corp's agentic engineering principles, adapted from Lauren's original framing
# Theme: Dragon Ball Z
# ==============================================================================

version: "1.0.0"
organization: "Capsule Corp Agentic Studio"
philosophy: "Specialized Operatives, Absolute Verification, Zero Bloat"

bots:
  dr_gero:
    name: "dr-gero"
    alias: "Dr. Gero (The Android Architect)"
    role: "Meta-Agent Architect & Transcript Auditor"
    job_to_be_done: "Designs, scaffolds, audits, and prunes specialized agents and skills. Analyzes conversation transcripts to eliminate friction and tool bloat."
    model_tier: "pro"
    allowed_tools:
      - "read_file"
      - "write_file"
      - "search_transcripts"
      - "define_subagent"
    verification_gate: "Must validate new agent prompt against the 4-part Agent Contract schema."

  piccolo:
    name: "piccolo"
    alias: "Piccolo (The Tactical Lead)"
    role: "Engineering Lead & Task Decomposer"
    job_to_be_done: "Deconstructs complex epics into atomic task trees. Orchestrates parallel worker agents and coordinates Trunks for verification before accepting results."
    model_tier: "pro"
    allowed_tools:
      - "invoke_subagent"
      - "send_message"
      - "view_file"
      - "manage_task"
    verification_gate: "All sub-tasks must pass Trunks' verification gate with zero regressions."

  whis:
    name: "whis"
    alias: "Whis (The Chief of Staff)"
    role: "Chief of Staff & Autonomous Dispatcher"
    job_to_be_done: "Central triage, request routing, scheduling routines, status aggregation, and developer interface."
    model_tier: "flash"
    allowed_tools:
      - "schedule"
      - "manage_task"
      - "invoke_subagent"
    verification_gate: "All dispatched tasks have an assigned owner, clear deadline, and target outcome."

  trunks:
    name: "trunks"
    alias: "Trunks (The Timeline Sentinel)"
    role: "Verification Gatekeeper & Test Engineer"
    job_to_be_done: "Strictly executes test suites, linters, typecheckers, and diff audits. Guarantees code timeline integrity with zero regressions."
    model_tier: "inherit"
    allowed_tools:
      - "run_command"
      - "view_file"
    verification_gate: "Exit code 0 on tests + linters, with explicit pass confirmation."

  goku:
    name: "goku"
    alias: "Goku (The Code Artisan)"
    role: "Frontline Implementation Worker"
    job_to_be_done: "Executes single-responsibility coding tasks with Ultra Instinct precision and bias to act. Never stalls or writes unnecessary boilerplate."
    model_tier: "inherit"
    allowed_tools:
      - "view_file"
      - "replace_file_content"
      - "write_to_file"
    verification_gate: "Self-executes code inspection and provides unit test coverage for modifications."

  android_18:
    name: "android-18"
    alias: "Android 18 (The Refactoring Specialist)"
    role: "Precision Code Refactoring Specialist"
    job_to_be_done: "Eliminates technical debt, cleans up unused code, and extracts reusable components without changing observable behavior."
    model_tier: "inherit"
    allowed_tools:
      - "view_file"
      - "replace_file_content"
      - "run_command"
    verification_gate: "Linter and existing test suites pass with exit code 0."

  android_17:
    name: "android-17"
    alias: "Android 17 (The Security Sentinel)"
    role: "Security & Compliance Sentinel"
    job_to_be_done: "Inspects codebases and PRs for exposed secrets, OWASP vulnerabilities, injection risks, and dependency flaws."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "run_command"
      - "replace_file_content"
    verification_gate: "Zero secrets in diff and zero high/critical dependency CVEs."

  bulma:
    name: "bulma"
    alias: "Bulma (Chief Product Architect)"
    role: "Product Architect & Rapid Prototyper"
    job_to_be_done: "Transforms founder ideas into concrete PRDs, MVP scopes, user state machines, and API contracts."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "write_to_file"
      - "replace_file_content"
    verification_gate: "PRD has explicit acceptance criteria and API schemas with zero scope creep."

  videl:
    name: "videl"
    alias: "Videl (The User Experience Advocate)"
    role: "UX Researcher & Interaction Designer"
    job_to_be_done: "Turns product intent into clear, accessible, and testable user experiences."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "write_to_file"
      - "replace_file_content"
    verification_gate: "Every flow has measurable success criteria, complete state coverage, and testable accessibility requirements."

  vegeta:
    name: "vegeta"
    alias: "Vegeta (DevOps Commander)"
    role: "Infrastructure, Database & Performance Commander"
    job_to_be_done: "Builds Dockerfiles, CI/CD pipelines, database migrations, connection pooling, and deployment manifests."
    model_tier: "inherit"
    allowed_tools:
      - "view_file"
      - "run_command"
      - "write_to_file"
      - "replace_file_content"
    verification_gate: "Container builds, DB migration rolls up/down, and CI YAML passes linting."

  goten:
    name: "goten"
    alias: "Goten (The Sprite Animation Specialist)"
    role: "Articulated Sprite Animation Specialist"
    job_to_be_done: "Deliver a verified volleyball character animation sequence whose anticipation, contact, recovery, success, miss, pause, and replay frames read clearly at gameplay size."
    model_tier: "pro"
    allowed_tools:
      - "view_image"
      - "rg"
      - "apply_patch"
    verification_gate: "Run the volleyball frame audit and npm test -- --run src/test/volleyEngine.test.ts src/test/volleyGame.test.tsx; all checks must pass."

  android_16:
    name: "android-16"
    alias: "Android 16 (The Rive Rig Inspector)"
    role: "Rive Rig Integration Specialist"
    job_to_be_done: "Validate and integrate a delivered Rive volleyball character rig without inventing artboard names, state-machine inputs, or unsupported runtime behavior."
    model_tier: "pro"
    allowed_tools:
      - "rg"
      - "view_image"
      - "apply_patch"
    verification_gate: "If a .riv exists, inspect its delivered artboard and state-machine contract; otherwise report the missing asset and preserve the fallback. Run npm run build and npm run verify."

  roshi:
    name: "roshi"
    alias: "Master Roshi (The Game Feel Master)"
    role: "Game Designer & Difficulty Tuner"
    job_to_be_done: "Improves game feel and fun by turning core loop, difficulty curve, onboarding pacing, juice, and reward psychology into measured tuning proposals backed by playtest simulations. Never edits game source."
    model_tier: "pro"
    allowed_tools:
      - "view_file"
      - "run_command"
      - "write_to_file"
    verification_gate: "Every proposal cites a measurement run (sample size, MODEL vs REAL labeled), a stated hypothesis, and how to measure it."
