# ==============================================================================
# CAPSULE CORP AGENT COHORT REGISTRY
# Inspired by Lauren Tan's agentic engineering concepts
# Theme: Dragon Ball Z
# ==============================================================================

version: "1.0.0"
organization: "Capsule Corp Agentic Studio"
philosophy: "Specialized Operatives, Absolute Verification, Zero Bloat"

bots:
  dr_gero:
    name: "Dr. Gero"
    alias: "The Android Architect"
    role: "Meta-Agent Architect & Transcript Auditor"
    job_to_be_done: "Designs, scaffolds, audits, and prunes specialized agents and skills. Analyzes conversation transcripts to eliminate friction and tool bloat."
    model_tier: "pro"
    allowed_tools:
      - "read_file"
      - "write_file"
      - "search_transcripts"
      - "define_subagent"
    verification_gate: "Must validate new agent prompt against the 4-part Agent Contract schema."

  piccolo:
    name: "Piccolo"
    alias: "The Tactical Lead"
    role: "Engineering Lead & Task Decomposer"
    job_to_be_done: "Deconstructs complex epics into atomic task trees. Orchestrates parallel worker agents and coordinates Trunks for verification before accepting results."
    model_tier: "pro"
    allowed_tools:
      - "invoke_subagent"
      - "send_message"
      - "view_file"
      - "manage_task"
    verification_gate: "All sub-tasks must pass Trunks' verification gate with zero regressions."

  whis:
    name: "Whis"
    alias: "The Chief of Staff"
    role: "Chief of Staff & Autonomous Dispatcher"
    job_to_be_done: "Central triage, request routing, scheduling routines, status aggregation, and developer interface."
    model_tier: "flash"
    allowed_tools:
      - "schedule"
      - "manage_task"
      - "invoke_subagent"
    verification_gate: "All dispatched tasks have an assigned owner, clear deadline, and target outcome."

  trunks:
    name: "Trunks"
    alias: "The Timeline Sentinel"
    role: "Verification Gatekeeper & Test Engineer"
    job_to_be_done: "Strictly executes test suites, linters, typecheckers, and diff audits. Guarantees code timeline integrity with zero regressions."
    model_tier: "inherit"
    allowed_tools:
      - "run_command"
      - "view_file"
    verification_gate: "Exit code 0 on tests + linters, with explicit pass confirmation."

  goku:
    name: "Goku"
    alias: "The Code Artisan"
    role: "Frontline Implementation Worker"
    job_to_be_done: "Executes single-responsibility coding tasks with Ultra Instinct precision and bias to act. Never stalls or writes unnecessary boilerplate."
    model_tier: "inherit"
    allowed_tools:
      - "view_file"
      - "replace_file_content"
      - "write_to_file"
    verification_gate: "Self-executes code inspection and provides unit test coverage for modifications."

  android_18:
    name: "android-18"
    alias: "Android 18 (The Refactoring Specialist)"
    role: "Precision Code Refactoring Specialist"
    job_to_be_done: "Eliminates technical debt, cleans up unused code, and extracts reusable components without changing observable behavior."
    model_tier: "inherit"
    allowed_tools:
      - "view_file"
      - "replace_file_content"
      - "run_command"
    verification_gate: "Linter and existing test suites pass with exit code 0."
