name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, where setup-python has no CPython 3.8 build, and
        # the x86_64 macos-13 runner is retired, so macOS runs 3.12 only.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        shell: bash
        run: python -m unittest discover -s tests -t .
      - name: Run capsule gates (explicit trust)
        shell: bash
        run: python bin/capsule check . --trust

  lint-and-installers:
    name: shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax check
        run: |
          for f in config/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck config/*.sh
