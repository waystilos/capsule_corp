name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run Go tests
        run: go test -v ./...
      - name: Build Go binary
        run: go build -v -o bin/capsule-go ./cmd/capsule
      - name: Run capsule verification gate
        shell: bash
        run: ./bin/capsule check .

  lint-and-installers:
    name: shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax check
        run: |
          for f in config/*.sh bin/capsule; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck config/*.sh bin/capsule
