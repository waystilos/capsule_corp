name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, where setup-python has no CPython 3.8 build;
        # macos-13 (x86_64) is used for 3.8 instead (see include below).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-13
            python-version: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        shell: bash
        run: python -m unittest discover -s tests -t .
      - name: Run capsule gates (explicit trust)
        shell: bash
        run: python bin/capsule check . --trust

  lint-and-installers:
    name: shell lint and installer dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax check
        run: |
          for f in config/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck config/*.sh scripts/*.sh
      - name: Elixir installer dry-run (PowerShell)
        shell: pwsh
        run: ./scripts/install_elixir.ps1 -DryRun -Json
