version: "1.0.0"
# `entry:` lists envelope fields the CALLER must supply for the route (artifacts by reference).
# root_request and ledger are always seeded by the router.
fallback: whis
routes:
  - intent: product_strategy
    owner: bulma
    keywords: [product, mvp, prd, roadmap, scope, api, requirements, feature brief]
    handoff: [bulma, videl, piccolo]
    avoid: [implementation, usability, accessibility]
  - intent: user_experience
    owner: videl
    keywords: [ux, usability, user experience, accessibility, onboarding, wireframe, interaction, journey, empty state, error state]
    handoff: [videl, bulma, piccolo]
    avoid: [api schema, database migration, deployment]
  - intent: task_planning
    owner: piccolo
    keywords: [plan, decompose, epic, task tree, orchestrate, break down]
    handoff: [piccolo, goku, trunks]
    avoid: [write code, implement]
  - intent: implementation
    owner: goku
    keywords: [implement, code, fix, bug, build, feature, test]
    handoff: [goku, trunks]
    entry: [target_files]
    avoid: [security audit, product scope, deploy]
  - intent: verification
    owner: trunks
    strong_keywords: [bugs, faults, check for bugs, find bugs, regression]
    keywords: [verify, test, tests, lint, typecheck, regression, ci, quality]
    handoff: [trunks]
    entry: [diff_reference]
    avoid: [implement, refactor]
  - intent: security
    owner: android-17
    strong_keywords: [vulnerability, vulnerabilities, leaked, leak, credential leak, credentials, credential, exposed credentials, exposed secrets, exposed key, leaked key, rotate, api key, auth bypass, cve, xss, csrf, rce, sqli, sql injection, path traversal, deserialization, privilege escalation, buffer overflow, crypto, cryptography, encryption, jwt, oauth]
    keywords: [security, vulnerability, vuln, secret, secrets, cve, owasp, auth, injection, dependency audit, password, passwords, token, tokens, exploit, privilege, overflow, bypass, traversal, session, cookie, cookies, cors, hash, sanitize, sanitization]
    handoff: [android-17, trunks]
    entry: [diff_reference]
    avoid: [design, product scope]
  - intent: refactoring
    owner: android-18
    keywords: [refactor, technical debt, dead code, cleanup, simplify, duplicate]
    handoff: [android-18, trunks]
    entry: [target_files]
    avoid: [new feature, product scope]
  - intent: infrastructure
    owner: vegeta
    keywords: [docker, ci/cd, pipeline, deploy, infrastructure, database, migration, performance, index, runtime, install, setup, elixir, erlang]
