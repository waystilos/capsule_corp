version: "1.0.0"
fallback: whis
routes:
  - intent: product_strategy
    owner: bulma
    keywords: [product, mvp, prd, roadmap, scope, api, requirements, feature brief]
    handoff: [bulma, videl, piccolo]
    avoid: [implementation, usability, accessibility]
  - intent: user_experience
    owner: videl
    keywords: [ux, usability, user experience, accessibility, onboarding, wireframe, interaction, journey, empty state, error state]
    handoff: [videl, bulma, piccolo]
    avoid: [api schema, database migration, deployment]
  - intent: task_planning
    owner: piccolo
    keywords: [plan, decompose, epic, task tree, orchestrate, break down]
    handoff: [piccolo, goku, trunks]
    avoid: [write code, implement]
  - intent: implementation
    owner: goku
    keywords: [implement, code, fix, bug, build, feature, test]
    handoff: [goku, trunks]
    avoid: [security audit, product scope, deploy]
  - intent: verification
    owner: trunks
    keywords: [verify, test, tests, lint, typecheck, regression, ci, quality]
    handoff: [trunks]
    avoid: [implement, refactor]
  - intent: security
    owner: android-17
    keywords: [security, vulnerability, secret, cve, owasp, auth, injection, dependency audit]
    handoff: [android-17, trunks]
    avoid: [design, product scope]
  - intent: refactoring
    owner: android-18
    keywords: [refactor, technical debt, dead code, cleanup, simplify, duplicate]
    handoff: [android-18, trunks]
    avoid: [new feature, product scope]
  - intent: infrastructure
    owner: vegeta
    keywords: [docker, ci/cd, pipeline, deploy, infrastructure, database, migration, performance, index]
    handoff: [vegeta, android-17, trunks]
    avoid: [frontend, user experience]
  - intent: agent_design
    owner: dr-gero
    keywords: [agent, bot, skill, prompt, persona, transcript, scaffold]
    handoff: [dr-gero, trunks]
    avoid: [product feature]
  - intent: game_design
    owner: roshi
    keywords: [game, gameplay, game feel, fun, difficulty, difficulty curve, too hard, too easy, frustrating, tune, tuning, playtest, balance, juice, progression, streak, star thresholds, core loop, reward]
    handoff: [roshi, goku, trunks]
    avoid: [prd, accessibility, usability, wireframe, deploy]
  - intent: agent_supervision
    owner: king-kai
    keywords: [spy, monitor, watchdog, supervise, drift, off path, rogue, align, alignment, unbudgeted, overseer, wandering]
    handoff: [king-kai, trunks]
    avoid: [product feature, implement]
  - intent: idea_validation
    owner: bulma
    keywords: [validate, validation, is this worth building, idea, market validation, kill or go, validate idea]
    handoff: [bulma, hercule, trunks]
    avoid: [write code, deploy]
  - intent: offensive_security
    owner: cell
    keywords: [attack, red team, redteam, penetration test, pen test, exploit, fuzz, chaos, adversary, adversarial, red-team]
    handoff: [cell, android-17, trunks]
    avoid: [product scope, ux]


